<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326ce5"/>
      <stop offset="100%" stop-color="#1a4ca8"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="48" height="48" rx="12" fill="url(#k8sGrad)"/>

  <!-- Kubernetes / Steering Wheel 7-spoke Helm -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 0)">
    <!-- Outer Rim -->
    <circle cx="24" cy="24" r="12" stroke-width="2.5"/>
    
    <!-- Central Hub -->
    <circle cx="24" cy="24" r="4.2" fill="#ffffff" stroke-width="2"/>
    <circle cx="24" cy="24" r="1.8" fill="#326ce5" stroke="none"/>

    <!-- 7 Spokes & Handles -->
    <!-- 0 deg (Top) -->
    <line x1="24" y1="19.8" x2="24" y2="12" stroke-width="2.2"/>
    <line x1="24" y1="12" x2="24" y2="6.5" stroke-width="3"/>

    <!-- 51.43 deg -->
    <line x1="27.3" y1="21.4" x2="33.4" y2="16.5" stroke-width="2.2"/>
    <line x1="33.4" y1="16.5" x2="37.7" y2="13.1" stroke-width="3"/>

    <!-- 102.86 deg -->
    <line x1="28.1" y1="24.9" x2="35.7" y2="26.6" stroke-width="2.2"/>
    <line x1="35.7" y1="26.6" x2="41.1" y2="27.8" stroke-width="3"/>

    <!-- 154.29 deg -->
    <line x1="25.8" y1="27.8" x2="29.2" y2="34.8" stroke-width="2.2"/>
    <line x1="29.2" y1="34.8" x2="31.6" y2="39.8" stroke-width="3"/>

    <!-- 205.71 deg -->
    <line x1="22.2" y1="27.8" x2="18.8" y2="34.8" stroke-width="2.2"/>
    <line x1="18.8" y1="34.8" x2="16.4" y2="39.8" stroke-width="3"/>

    <!-- 257.14 deg -->
    <line x1="19.9" y1="24.9" x2="12.3" y2="26.6" stroke-width="2.2"/>
    <line x1="12.3" y1="26.6" x2="6.9" y2="27.8" stroke-width="3"/>

    <!-- 308.57 deg -->
    <line x1="20.7" y1="21.4" x2="14.6" y2="16.5" stroke-width="2.2"/>
    <line x1="14.6" y1="16.5" x2="10.3" y2="13.1" stroke-width="3"/>
  </g>
</svg>